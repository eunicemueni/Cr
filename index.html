<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kairah Studio — Divine Cinematics by AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #F9F9F9;
    }
    header {
      background-color: #3D2C41; /* Midnight Plum */
      color: white;
    }
    .btn-gold {
      background-color: #D4AF37; /* Kairah Gold */
      color: white;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px 20px;
    }
    .btn-gold:hover {
      background-color: #b9962f;
    }
    .highlight {
      color: #008080; /* Teal Accent */
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header class="p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Kairah Studio</h1>
    <nav class="space-x-6 text-lg">
      <a href="#" class="hover:text-[#D4AF37]">Home</a>
      <a href="#" class="hover:text-[#D4AF37]">Pricing</a>
      <a href="#" class="hover:text-[#D4AF37]">About</a>
      <a href="#" class="hover:text-[#D4AF37]">Contact</a>
    </nav>
  </header>

  <section class="text-center py-20">
    <h2 class="text-4xl font-bold text-[#3D2C41] mb-4">Create Cinematic AI Videos</h2>
    <p class="text-gray-700 mb-8">Transform your imagination into <span class="highlight">visual masterpieces</span>.</p>
    <button class="btn-gold">Get Started</button>
  </section>

  <footer class="text-center py-4 bg-[#3D2C41] text-white">
    © 2025 Kairah Studio — All Rights Reserved
  </footer>
</body>
</html>
